name: Fetch headlines

on:
  schedule:
    # Twice a day: ~10:17 UTC (6 AM EDT / 5 AM EST) and ~19:43 UTC (3 PM EDT / 2 PM EST).
    # Off-the-hour minutes: GitHub delays or drops scheduled runs at the top of the hour.
    - cron: "17 10 * * *"
    - cron: "43 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python fetch.py

      - run: python tools/health_report.py

      - name: Commit updated data
        run: |
          git config user.name "local-news-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update headlines $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase
            git push
          fi
